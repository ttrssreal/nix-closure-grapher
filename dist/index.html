<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nix closure grapher</title>
  </head>
  <body>
    <style>
      html, body, #container {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      .info, .upload {
        position: absolute;
        z-index: 1;
      }

      .info {
        top: 10px;
        left: 10px;
        width: 700px;
        height: 300px;
      }

      .upload {
        top: 10px;
        right: 10px;
        display: flex;
        flex-direction: column;
      }

      .upload * {
        margin: 5px;
      }
    </style>
    <div class="info">
      <table id="infoTable"></table>
    </div>
    <div class="upload">
      <input type="file" id="upload" name="upload" accept="application/json"></input>
      <div>
        <input type="checkbox" id="live-update-graph" name="live-update-graph">Live graph updates (may be slow)</input>
      </div>
    </div>
    <div id="container"></div>
    <script src="main.js"></script>
  </body>
</html>
